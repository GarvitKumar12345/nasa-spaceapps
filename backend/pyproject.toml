[project]
name = "skyshift"
version = "0.1.0"
description = "SkyShift: find, explain, and document changes in astronomical images (local research build)."
requires-python = ">=3.12,<3.14"
# Scientific stack is pinned exactly: measured results depend on these versions.
# uv.lock pins the full transitive set.
dependencies = [
  "numpy==2.5.4",
  "scipy==1.18.1",
  "astropy==8.0.2",
  "pydantic==2.14.3",
  "fastapi==0.162.7",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "httpx2==2.16.0",
  "photutils>=3.1.1",
]
# Archive clients are installed only when live integrations are implemented
# (next session). They are NOT used by the synthetic investigation.
archive = [
  "astroquery==0.4.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skyshift"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "math: mathematical/physical model checks (astrometry, coordinates, time)",
  "coords: coordinate, WCS, and pixel-convention checks",
  "measurement: source detection and PSF/centroid measurement checks on generated pixels",
  "registration: image registration and reprojection checks",
  "catalog: catalog epoch propagation and cross-matching checks",
  "pipeline: end-to-end synthetic investigation checks",
  "contracts: schema, provenance, and export/import checks",
  "api: HTTP API checks",
  "slow: slower statistical checks (multiple seeds / Monte Carlo)",
  "archive: real archive products (recorded SPHEREx files and responses) checked offline against documented formats",
  "live: requires network access to an external archive (not run by default)",
]
filterwarnings = [
  "error::astropy.utils.exceptions.AstropyDeprecationWarning",
]
